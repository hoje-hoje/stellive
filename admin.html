<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STELLIVE 관리자</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script>
  // admin.html 을 그냥 열면 사이트를 보면서 고치는 편집 모드로 간다. 목록 화면은 admin.html#site 처럼 탭을 붙여 연다
  if (!location.hash) location.replace('./?edit#/');
</script>
<script src="config.js"></script>
<script src="js/common.js"></script>
<style>
  :root { --raise: var(--panel); --raise2: var(--tile); }
  .adm { max-width: 1180px; margin: 0 auto; padding: 28px 24px 120px; display: flex; flex-direction: column; gap: 22px; }
  .adm-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .adm-brand { display: flex; align-items: center; gap: 12px; font-family: var(--bodoni); font-size: 15px; letter-spacing: .32em; }
  .adm-brand img { width: 30px; height: 30px; }
  .adm-brand small { font-size: 11px; letter-spacing: .4em; color: var(--dim); }
  .panel { background: var(--panel); border: 1px solid var(--line); padding: 24px; }
  .adm .tabs { margin: 0; }
  .adm .tabs a { font-family: var(--batang); font-size: 19px; }
  .row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
  .row > .field { flex: 1 1 160px; }
  .imgf { display: flex; gap: 10px; align-items: center; }
  .imgf .prev { width: 64px; height: 64px; background: var(--tile) center / cover; flex: none; border: 1px solid var(--line); }
  .imgf .prev.wide { width: 140px; height: 48px; }
  .imgf .prev.tall { width: 48px; height: 72px; background-size: contain; background-repeat: no-repeat; }
  .imgf input[type=text] { flex: 1; }
  .mlist { display: flex; flex-direction: column; gap: 4px; }
  .mrow { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); cursor: pointer; font-family: var(--batang); font-size: 17px; }
  .mrow.on { border-color: var(--accent); background: var(--today); }
  .mrow small { color: var(--dim); margin-left: auto; font-size: 12px; font-family: var(--sans); }
  .two { display: grid; grid-template-columns: 260px 1fr; gap: 20px; align-items: start; }
  .editor { display: flex; flex-direction: column; gap: 14px; }
  .editor h2 { font-family: var(--batang); font-size: 24px; }
  .savebar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; padding: 12px 24px; display: flex; gap: 10px; align-items: center; justify-content: flex-end; background: var(--bar); border-top: 1px solid var(--line2); backdrop-filter: blur(16px); }
  .savebar #dirty { color: var(--accent); font-size: 13px; margin-right: auto; }
  .ctable { width: 100%; border-collapse: collapse; font-size: 13px; }
  .ctable td, .ctable th { padding: 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
  .ctable th { color: var(--dim); font-weight: 600; }
  .ctable td.t { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gate { text-align: center; padding: 18px 20px; display: flex; flex-direction: column; align-items: center; gap: 14px; font-size: 14px; }
  .gate h2 { font-family: var(--batang); font-size: 24px; }
  .check { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-size: 14px; }
  .check input { width: 18px; height: 18px; accent-color: var(--accent); }
  textarea { resize: vertical; min-height: 70px; }
  .field input[type=color], input[type=color] { width: 100%; min-width: 64px; height: 44px; padding: 4px; border: 1px solid var(--line2); background: var(--bg); cursor: pointer; }
  input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
  input[type=color]::-webkit-color-swatch { border: 0; }
  input[type=color]::-moz-color-swatch { border: 0; }
  .danger { color: #d23a52 !important; }
  @media (max-width: 760px) { .two { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="nebula" aria-hidden="true"></div>

<div class="adm">
  <div class="adm-top">
    <a class="adm-brand" href="./"><img src="assets/logo.svg" alt="">STELLIVE <small>ADMIN</small></a>
    <span class="grow"></span>
    <a class="btn sm solid" href="./?edit#/">✎ 사이트에서 보며 고치기</a>
    <span id="admDots"></span>
    <div id="login"></div>
  </div>
  <div id="gate" class="panel gate"></div>
  <div id="app" hidden>
    <nav class="tabs" id="admTabs">
      <a href="#site">사이트</a>
      <a href="#groups">기수</a>
      <a href="#members">멤버</a>
      <a href="#events">일정</a>
      <a href="#texts">글자</a>
      <a href="#colors">테마 색</a>
      <a href="#about">About</a>
      <a href="#content">올라온 것</a>
    </nav>
    <section class="panel" id="pane" style="margin-top:16px"></section>
  </div>
</div>

<div class="savebar" id="savebar" hidden>
  <span id="dirty"></span>
  <button class="btn sm" id="dlJson">site.json 내려받기</button>
  <button class="btn solid" id="saveBtn">저장</button>
</div>

<script src="js/texts.js"></script>
<script src="js/guide.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
