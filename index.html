<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STELLIVE ARCHIVE</title>
<meta name="description" content="팬이 만든 비공식 스텔라이브 아카이브 — 멤버별 커버곡 · 오리곡 · 클립 · 팬아트">
<meta name="theme-color" content="#070820">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script src="config.js"></script>
<script src="js/common.js"></script>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>

<!-- 첫 화면 (하루 한 번) -->
<section id="intro" hidden aria-label="첫 화면">
  <div class="in-wall">
    <div class="in-brand"><img src="assets/logo.svg" data-img="logo" data-ei="images.logo" data-pos="logo.intro" alt=""><span data-t="brand.name"></span></div>
    <img class="in-crest" id="introCrestImg" alt="" aria-hidden="true" data-ei="images.crest" data-pos="crest" hidden>
    <svg class="in-crest" id="introCrestSvg" data-ei="images.crest" data-pos="crest" viewBox="0 0 100 100" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width=".6"><circle cx="50" cy="50" r="48"/><circle cx="50" cy="50" r="41" stroke-width=".4"/><path d="M79 21A41 41 0 1 1 21 79Z"/><path d="M30 42Q31.6 58.4 49 61 31.6 63.6 30 80 28.4 63.6 10.5 61 28.4 58.4 30 42Z"/><path d="M40.8 64Q41.6 71.9 49.5 72.8 41.6 73.7 40.8 81.6 40 73.7 32.1 72.8 40 71.9 40.8 64Z"/></g></svg>
    <div class="in-foot">
      <em data-t="intro.wallEn"></em>
      <small data-t="intro.wallKo"></small>
    </div>
  </div>
  <div class="in-sky" id="introSky" data-ei="images.intro"></div>
  <!-- 공전하는 별: 앞(아래)으로 올 때 커지고 밝게, 뒤(위)로 갈 때 작고 흐리게 -->
  <svg class="in-orbit" id="introOrbit" viewBox="0 0 400 200" aria-hidden="true">
    <defs><path id="orbitPath" d="M20 100A180 58 0 1 0 380 100A180 58 0 1 0 20 100"/></defs>
    <use href="#orbitPath" class="orb-line"/>
    <circle class="orb-core" cx="200" cy="100" r="9"/>
    <g>
      <animateMotion dur="16s" repeatCount="indefinite"><mpath href="#orbitPath"/></animateMotion>
      <g>
        <animateTransform attributeName="transform" type="scale" dur="16s" repeatCount="indefinite" values=".7;1.35;.7;.45;.7" keyTimes="0;.25;.5;.75;1" calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1;.4 0 .6 1;.4 0 .6 1"/>
        <animate attributeName="opacity" dur="16s" repeatCount="indefinite" values=".75;1;.75;.35;.75" keyTimes="0;.25;.5;.75;1"/>
        <circle class="orb-glow" r="13"/>
        <path class="orb-star" transform="scale(1.45)" d="M0-9C.5-2.5 2.5-.5 9 0 2.5.5.5 2.5 0 9-.5 2.5-2.5.5-9 0-2.5-.5-.5-2.5 0-9Z"/>
      </g>
    </g>
  </svg>
  <div class="in-dots" id="introDots"></div>
  <div class="in-type">
    <span class="sc" data-t="intro.kicker"></span>
    <span class="in-title" data-t="intro.title"></span>
    <span class="in-sub" data-t="intro.sub"></span>
    <i class="in-rule"></i>
    <span class="in-ko" data-t="intro.ko"></span>
  </div>
  <button type="button" class="in-enter" id="enterBtn"><span data-t="intro.enter"></span>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
  </button>
  <label class="in-skip"><input type="checkbox" id="skipToday"><span data-t="intro.skip"></span></label>
</section>

<!-- 왼쪽 벽에 마우스를 대면 목차가 나온다 -->
<div class="edge edge-left" id="edgeLeft" aria-hidden="true"></div>
<button type="button" class="index-tab" id="indexTab" aria-label="목차 열기" aria-controls="drawer"><span data-t="nav.title"></span></button>
<aside id="drawer" aria-label="목차"></aside>

<!-- 위 링크 줄: 오른쪽 위 ☰ 로 연다 -->
<header id="topbar">
  <button type="button" class="icon-btn menu-btn" id="menuBtn" aria-label="목차 열기">
    <svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <a class="tb-brand" href="#/"><img src="assets/logo.svg" data-img="logo" alt=""><span data-t="brand.name"></span></a>
  <nav class="tb-links" id="tbLinks"></nav>
  <button type="button" class="btn sm solid tb-up" data-upload="{}" data-t="nav.upload"></button>
</header>

<!-- 왼쪽 위 로고: 누르면 홈 -->
<a class="home-logo" href="#/" aria-label="홈으로"><img src="assets/logo.svg" data-img="logo" data-ei="images.logo" data-pos="logo.home" alt=""></a>

<div class="corner" id="corner">
  <span id="cornerDots"></span>
  <button type="button" class="btn sm line" id="introBtn" title="첫 화면 다시 보기">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c.5 4.8 2.7 8 9.5 9.5-6.8 1.5-9 4.7-9.5 9.5-.5-4.8-2.7-8-9.5-9.5 6.8-1.5 9-4.7 9.5-9.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
    <b data-t="nav.intro"></b>
  </button>
  <button type="button" class="btn sm line burger" id="topBtn" aria-label="링크 줄 열기" aria-expanded="false" aria-controls="topbar">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
</div>

<main id="view"></main>

<!-- 영상 창 -->
<div id="stage" data-view="mini" data-kind="">
  <div class="stage-bar">
    <button type="button" data-s="page" title="노래 창" aria-label="노래 창으로 크게 보기">⛶</button>
    <button type="button" data-s="big" title="크게" aria-label="크게">⤢</button>
    <button type="button" data-s="mini" title="작게" aria-label="작게">▭</button>
    <button type="button" data-s="hidden" title="숨기기 (소리는 계속)" aria-label="숨기기">—</button>
  </div>
  <div class="stage-body">
    <div id="ytWrap"><div id="ytHost"></div></div>
    <video playsinline controls></video>
    <iframe allow="autoplay; encrypted-media" allowfullscreen title="드라이브 미리보기"></iframe>
  </div>
</div>

<!-- 아래 플레이어 -->
<div id="player" hidden>
  <input id="pSeek" type="range" min="0" max="1000" value="0" aria-label="재생 위치">
  <div class="p-row">
    <div class="p-now">
      <button type="button" id="pThumb" data-p="page" aria-label="노래 창 열기"></button>
      <div data-p="page" class="p-txt"><b id="pTitle"></b><small id="pSub"></small></div>
      <button type="button" class="icon-btn" data-p="fav" title="별표"></button>
    </div>
    <div class="p-ctl">
      <button type="button" class="icon-btn" data-p="shuffle" title="랜덤" aria-label="랜덤"></button>
      <button type="button" class="icon-btn" data-p="prev" title="이전" aria-label="이전"></button>
      <button type="button" class="icon-btn big" data-p="toggle" title="재생/일시정지" aria-label="재생/일시정지"></button>
      <button type="button" class="icon-btn" data-p="next" title="다음" aria-label="다음"></button>
      <button type="button" class="icon-btn on" data-p="repeat" title="전체 반복" aria-label="반복"></button>
    </div>
    <div class="p-side">
      <span id="pSrc"></span>
      <button type="button" class="chip-btn" data-p="prefer"></button>
      <span id="pTime"></span>
      <button type="button" class="icon-btn" data-p="page" title="노래 창" aria-label="노래 창"></button>
      <button type="button" class="icon-btn on" data-p="hide" title="영상 창 보이기/숨기기" aria-label="영상 창"></button>
      <button type="button" class="icon-btn" data-p="queue" title="재생 목록" aria-label="재생 목록"></button>
      <button type="button" class="icon-btn" data-p="close" title="노래 끄고 내리기" aria-label="노래 끄고 내리기"></button>
    </div>
  </div>
</div>
<div id="queue"><div class="q-head"><b data-t="player.queue"></b><span></span></div><ol></ol></div>

<!-- 보기 창 -->
<div class="modal" id="viewer" hidden>
  <div class="modal-box wide" role="dialog" aria-modal="true" aria-label="보기">
    <button type="button" class="icon-btn close" data-close aria-label="닫기"></button>
    <div class="viewer-body"></div>
    <div class="viewer-foot"></div>
  </div>
</div>

<!-- 올리기 창 -->
<div class="modal" id="upload" hidden>
  <form class="modal-box" autocomplete="off" role="dialog" aria-modal="true" aria-labelledby="upH">
    <button type="button" class="icon-btn close" data-close aria-label="닫기"></button>
    <h2 id="upH"><span class="sc">Upload</span><span data-t="upload.title"></span></h2>
    <p class="hint" id="upHint"></p>

    <div class="field"><span data-t="upload.kind"></span><div class="chips" id="upKind"></div></div>
    <div class="field"><span><span data-t="upload.members"></span> <em data-t="upload.membersNote"></em></span><div class="chips" id="upMembers"></div></div>
    <label class="field"><span><span data-t="upload.group"></span> <em data-t="upload.groupNote"></em></span><select id="upGroup"></select></label>
    <label class="field"><span data-t="upload.titleField"></span><input id="upTitle" data-tp="upload.titlePh"></label>

    <fieldset class="sources">
      <legend><span data-t="upload.where"></span> <em data-t="upload.whereNote"></em></legend>
      <label class="field"><span><span data-t="upload.link"></span> <em data-t="upload.linkNote"></em></span><input id="upUrl" type="url" placeholder="https://"></label>
      <label class="field drop"><input id="upFile" type="file" accept="video/*,audio/*,image/*"><span class="drop-txt" data-t="upload.drop"></span></label>
      <label class="field"><span><span data-t="upload.alt"></span> <em data-t="upload.altNote"></em></span><input id="upAlt" type="url" placeholder="https://drive.google.com/file/d/…"></label>
    </fieldset>

    <p class="hint small"><a href="#/about" data-t="upload.rules"></a></p>
    <div class="modal-actions">
      <span class="grow" id="upStatus"></span>
      <button type="submit" class="btn solid" id="upSubmit" data-t="upload.submit"></button>
    </div>
  </form>
</div>

<script src="js/texts.js"></script>
<script src="js/guide.js"></script>
<script src="js/player.js"></script>
<script src="js/app.js"></script>
<script src="js/edit.js"></script>
</body>
</html>
